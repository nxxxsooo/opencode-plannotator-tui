name: Install test Plannotator TUI
description: Install the checksum-pinned upstream Linux binary used by behavior tests
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/plannotator-bin"
        binary="$RUNNER_TEMP/plannotator-bin/plannotator-tui"
        curl --fail --location --retry 3 \
          https://github.com/plannotator/plannotator-tui/releases/download/v0.9.4/plannotator-tui-x86_64-unknown-linux-gnu \
          --output "$binary"
        echo "d54dc603c95f710677bc13ebe6b24b2e6eb10ce761577af8a95a05002862b74d  $binary" | sha256sum --check
        chmod +x "$binary"
        echo "$RUNNER_TEMP/plannotator-bin" >> "$GITHUB_PATH"
