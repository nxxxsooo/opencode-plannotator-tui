name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: ./.github/actions/setup-tui
      - run: npm ci
      - run: npm run check
      - run: python3 scripts/verify-package.test.py
      - name: Check existing version
        id: registry
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if published="$(npm view "$name@$version" dist.tarball 2>/dev/null)" && test -n "$published"; then
            mkdir -p "$RUNNER_TEMP/package-check"
            npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package-check"
            curl --fail --location --retry 3 "$published" --output "$RUNNER_TEMP/package-check/registry.tgz"
            python3 scripts/verify-package.py \
              "$RUNNER_TEMP/package-check/$name-$version.tgz" \
              "$RUNNER_TEMP/package-check/registry.tgz"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish through trusted publishing
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --access public
